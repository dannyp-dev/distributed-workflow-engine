services:
  postgres:
    image: postgres:18
    environment:
      POSTGRES_DB: workflow
      POSTGRES_USER: workflow
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U workflow -d workflow"]
      interval: 2s
      timeout: 3s
      retries: 20

  migrate:
    image: postgres:18
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      PGPASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    volumes:
      - ./migrations:/migrations:ro
    command:
      - sh
      - -c
      - >-
        for file in /migrations/*.sql; do
          psql -v ON_ERROR_STOP=1 -h postgres -U workflow -d workflow -f "$$file";
        done
    restart: "no"

  redis:
    image: redis:7.4-alpine
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "127.0.0.1:6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 2s
      timeout: 3s
      retries: 20

  api:
    build:
      context: .
      args:
        TARGET: api
    environment:
      DATABASE_URL: postgres://workflow:${POSTGRES_PASSWORD}@postgres:5432/workflow?sslmode=disable
      REDIS_URL: redis://redis:6379/0
      HTTP_ADDR: :8080
      GRPC_ADDR: :9090
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
    ports:
      - "127.0.0.1:8080:8080"
      - "127.0.0.1:9090:9090"
    restart: unless-stopped

  worker:
    build:
      context: .
      args:
        TARGET: worker
    environment:
      REDIS_URL: redis://redis:6379/0
      COORDINATOR_ADDR: api:9090
      WORKER_RECLAIM_MIN_IDLE: 30s
    depends_on:
      api:
        condition: service_started
      redis:
        condition: service_healthy
    restart: unless-stopped

volumes:
  postgres_data:
  redis_data:
